<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序 · 教学闭环</title><style>body{font:16px system-ui;background:#f1f5f5;color:#193d43;max-width:1000px;margin:30px auto;padding:20px}section{background:white;border-radius:12px;padding:24px;margin:20px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:10px;margin:10px 0;border:1px solid #b9cdcc;border-radius:6px}textarea{min-height:100px}button{background:#176c62;color:white;border:0;border-radius:6px;padding:12px;margin:5px}pre{white-space:pre-wrap}label{display:block}#status{position:sticky;top:0;background:#fff4d7;padding:14px}small{color:#617a7c}</style><style>
:root{--ink:#183b43;--green:#137b69}body{max-width:none;margin:0;padding:32px 42px 60px 268px;background:#f4f7fa;color:var(--ink);font-size:14px}body>h1{font-size:28px;margin:0 0 8px;letter-spacing:-1px}body>p{color:#70818c}#sidebar{position:fixed;left:0;top:0;bottom:0;width:218px;background:#123c41;color:white;padding:28px 16px;box-sizing:border-box}#sidebar h2{padding:0 12px;font-size:24px;margin-bottom:5px}#sidebar p{padding:0 12px;color:#92b8b8;font-size:12px;margin-bottom:35px}#sidebar button{display:block;width:100%;text-align:left;background:transparent;color:#bbd2d3;margin:7px 0;padding:14px;border-radius:8px}#sidebar button.active{background:#245358;color:white}#sidebar .foot{position:absolute;bottom:24px;color:#93b4b7;padding:12px;font-size:12px}#status{position:static;border:1px solid #f0e4bf;background:#fff9e9;border-radius:9px;color:#8a722f;font-size:12px}section{box-shadow:0 3px 16px #20384a04;border:1px solid #e2e9ee;border-radius:14px;padding:26px;margin:18px 0}section h2{font-size:19px;margin-top:0}input,textarea,select{background:#fbfcfd;border:1px solid #dbe4e9;padding:12px;border-radius:7px;color:#294651;font:inherit}input:focus,textarea:focus,select:focus{outline:2px solid #91d0c0}button{cursor:pointer;background:#147d69;font:inherit;font-weight:600;padding:12px 18px}button:hover{filter:brightness(1.08)}#dashboard .hero{background:linear-gradient(110deg,#e3f3ed,#edf6fb);border:1px solid #d6e9e3;padding:26px;border-radius:14px;margin-top:22px;display:flex;justify-content:space-between;align-items:center}.hero h2{font-size:25px;margin:0 0 10px}.hero p{color:#5f7b7d}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.metric{background:white;padding:22px;border:1px solid #e1e8ed;border-radius:12px}.metric b{display:block;font-size:30px;margin:10px 0}.metric span{font-size:12px;color:#6e8590}.dashboard-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.step{padding:15px 0;border-bottom:1px solid #edf1f4;display:flex;justify-content:space-between}.badge{font-size:11px;background:#e5f4ed;color:#237658;padding:5px 8px;border-radius:5px}.bar{height:9px;border-radius:8px;background:#e9eff3;overflow:hidden}.bar i{display:block;height:100%;background:#23a38b}#report{white-space:normal}#report pre{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{padding:13px;border-bottom:1px solid #edf0f4;text-align:left}#presentation:fullscreen{background:#123c41;color:white;padding:7vw;box-sizing:border-box;font-size:26px;display:flex;flex-direction:column;justify-content:center}#presentation:fullscreen pre{font:inherit;line-height:1.8}.student-mode{padding:30px;max-width:760px;margin:auto}.student-mode #sidebar{display:none}@media(max-width:900px){body{padding:22px}#sidebar{position:static;width:auto;border-radius:12px;margin-bottom:20px}#sidebar button{display:inline-block;width:auto}#sidebar p,#sidebar .foot{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start!important}}
</style><h1>知序 · 教学闭环</h1><p>人教版七年级数学上册 / 教材 → 备课 → 课堂 → 班级作业</p><p id="status" role="status">本地开发版；请导入有出处的材料。尚未内置官方教材，未接入大模型。无身份鉴权，仅使用模拟编号。</p><main id="teacher">
<section><h2>1. 指定教材材料</h2><small>按教师填写的版次与章节保存；未完成官方核验前，不标记为官方教材适配。</small><input id="edition" placeholder="出版年份 / 版次"><input id="chapter" placeholder="章节名称与编号（以实际教材为准）"><input id="source" placeholder="材料出处及页码"><textarea id="material" placeholder="粘贴有权使用的教材或教参片段"></textarea><button onclick="addMaterial()">保存教材材料</button></section>
<section><h2>2. 班级与教师备课</h2><input id="classname" placeholder="班级名称"><textarea id="students" placeholder="学生匿名编号，每行一个">S01
S02
S03</textarea><button onclick="addClass()">创建班级</button><label>教材材料<select id="materials"></select></label><label>班级<select id="classes"></select></label><button onclick="draft()">基于所选材料创建备课草案</button><textarea id="lesson" style="min-height:230px" placeholder="教学目标、重难点、教学流程、例题、分层任务；请教师编辑确认"></textarea><button onclick="approve()">审核并发布教案</button></section>
<section><h2>3. 课堂教学</h2><select id="lessons"></select><button onclick="present()">打开课堂演示</button><div id="presentation" hidden><pre id="slides"></pre><button onclick="nextSlide()">下一段</button><button onclick="document.exitFullscreen?.();$('presentation').hidden=true">结束演示</button></div><select id="topic"><option>移项</option><option>去括号</option><option>去分母</option></select><input id="count" type="number" value="5" min="1" max="20"><button onclick="publish('随堂检测')">发布随堂检测</button><button onclick="publish('课后作业')">布置课后作业</button><p id="join"></p></section>
<section><h2>4. 班级作业测评与备课反馈</h2><select id="assignments"></select><button onclick="report()">刷新提交与学情</button><button onclick="feedback()">将反馈带入下一课备课</button><pre id="report"></pre></section></main><main id="student" hidden></main>
<script>const $=s=>document.getElementById(s);let records=[],lastReport=null,slides=[],slide=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(path,data){let r=await fetch('/api/workflow/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error);return v}async function run(f){try{await f();$('status').textContent='已保存';await refresh()}catch(e){$('status').textContent=e.message}}async function refresh(){records=await fetch('/api/workflow').then(r=>r.json());for(const [id,kind] of [['materials','material'],['classes','class'],['lessons','lesson'],['assignments','assignment']]){let old=$(id).value;$(id).innerHTML=records.filter(r=>r.kind===kind).map(r=>`<option value="${r.id}">${esc(r.name||r.chapter||r.purpose||r.material?.chapter)} · ${r.id}</option>`).join('');if([...$(id).options].some(o=>o.value===old))$(id).value=old}}function chosen(id){let r=records.find(r=>r.id===$(id).value);if(!r)throw Error('请先建立对应记录');return r}function addMaterial(){run(()=>call('material',{edition:$('edition').value,chapter:$('chapter').value,source:$('source').value,text:$('material').value}))}function addClass(){run(()=>call('class',{name:$('classname').value,students:$('students').value}))}function draft(){try{let m=chosen('materials');$('lesson').value=`${m.book} / ${m.edition} / ${m.chapter}\n\n教材依据：${m.source}\n${m.text}\n\n教学目标：[教师填写]\n\n重难点：[教师填写]\n\n课堂导入：复习已学知识\n\n例题讲解：[依据材料补充]\n\n学生练习：[选择适配题目]\n\n随堂检测与总结：[教师填写]`}catch(e){$('status').textContent=e.message}}function approve(){run(()=>call('lesson',{material:chosen('materials').id,class_id:chosen('classes').id,text:$('lesson').value}))}function present(){try{slides=chosen('lessons').text.split('\n\n');slide=0;$('presentation').hidden=false;$('slides').textContent=slides[0];$('presentation').requestFullscreen?.().catch(()=>{})}catch(e){$('status').textContent=e.message}}function nextSlide(){slide=Math.min(slide+1,slides.length-1);$('slides').textContent=slides[slide]}function publish(purpose){run(async()=>{let a=await call('publish',{lesson:chosen('lessons').id,purpose,topic:$('topic').value,count:$('count').value});$('join').innerHTML=`学生入口：<a target="_blank" href="/workflow?assignment=${a.id}">${location.origin}/workflow?assignment=${a.id}</a>`})}function report(){run(async()=>{lastReport=await call('report',{assignment:chosen('assignments').id});$('report').textContent=JSON.stringify(lastReport,null,2)})}function feedback(){if(!lastReport){$('status').textContent='请先刷新学情';return}draft();$('lesson').value+='\n\n上次作业反馈（待教师确认）：\n'+JSON.stringify(lastReport.analysis?.summary||[],null,2)+'\n缺交：'+lastReport.missing.join('、');$('lesson').scrollIntoView({behavior:'smooth'})}async function student(id){$('teacher').hidden=true;$('student').hidden=false;let r=await fetch('/api/student/'+id),a=await r.json();if(!r.ok){$('student').textContent=a.error;return}$('student').innerHTML=`<section><h2>${esc(a.purpose)}</h2><input id="sid" placeholder="班级中的匿名学生编号">${a.questions.map((q,i)=>`<label>${esc(q.id)} · ${esc(q.text)}<input id="answer${i}" placeholder="填写 x 的值，支持分数"></label>`).join('')}<button id="submit">提交答案</button></section>`;$('submit').onclick=async()=>{try{await call('submit',{assignment:id,student:$('sid').value.trim(),answers:Object.fromEntries(a.questions.map((q,i)=>[q.id,$('answer'+i).value]))});$('status').textContent='提交成功';$('submit').disabled=true}catch(e){$('status').textContent=e.message}}}let aid=new URLSearchParams(location.search).get('assignment');if(aid)student(aid);else refresh();</script></html>
<script>
let view=0;
const sidebar=document.createElement('aside');sidebar.id='sidebar';sidebar.innerHTML='<h2>知序<span style="color:#65cfb2">.</span></h2><p>TEACHING WORKSPACE</p>'+['◈　教学概览','▤　教材资料','✎　班级与备课','▷　课堂教学','▥　作业与学情'].map((s,i)=>`<button onclick="switchView(${i})" id="nav${i}">${s}</button>`).join('')+'<div class="foot">七年级 · 数学上册<br><br>本地工作台 / 开发版</div>';document.body.prepend(sidebar);
const dashboard=document.createElement('div');dashboard.id='dashboard';$('teacher').prepend(dashboard);
function switchView(n){view=n;[...$('teacher').children].forEach((e,i)=>e.hidden=i!==n);for(let i=0;i<5;i++)$('nav'+i).classList.toggle('active',i===n);window.scrollTo(0,0)}
function drawDashboard(){let count=k=>records.filter(r=>r.kind===k).length,subs=records.filter(r=>r.kind==='submission'),a=records.find(r=>r.kind==='assignment'),cl=records.find(r=>r.kind==='class'),submitted=a?subs.filter(s=>s.assignment===a.id).length:0,total=cl?.students.length||0;dashboard.innerHTML=`<div class="hero"><div><h2>每一节课，都有清晰的下一步</h2><p>围绕教材组织备课，用课堂与作业反馈调整教学。</p><span class="badge">人教版七年级数学上册 · 教材版次待核实</span></div><button onclick="loadDemo()">＋ 加载完整模拟班级</button></div><div class="metrics">${[['教材材料',count('material'),'带出处的章节记录'],['已审核教案',count('lesson'),'可进入课堂演示'],['课堂与作业',count('assignment'),'已发布检测与作业'],['答题记录',subs.length,'匿名学生模拟或录入']].map(x=>`<div class="metric">${x[0]}<b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div><div class="dashboard-grid"><section><h2>从这里开始体验</h2>${[['查看教材依据','材料及来源',1],['打开已审核教案','40分钟示例课堂',2],['进入课堂演示','展示与随堂检测',3],['查看班级反馈','正确率及缺交',4]].map(x=>`<div class="step"><div><b>${x[0]}</b><p style="color:#86959e;margin:7px 0">${x[1]}</p></div><button onclick="switchView(${x[2]})">进入 →</button></div>`).join('')}</section><section><h2>当前班级提交概况</h2><p>${esc(cl?.name||'尚未创建班级')}</p><b style="font-size:38px">${submitted}<span style="font-size:15px;color:#84939d"> / ${total} 人</span></b><p>最新一份检测 / 作业的提交情况</p><div class="bar"><i style="width:${total?submitted/total*100:0}%"></i></div><p style="color:#87969e">加载演示后包含12名学生、10人提交、2人缺交，可直接查看学情。</p><div style="background:#fff8e8;padding:16px;border-radius:8px">模拟内容均为自编测试资料，不是官方教材原文。</div></section></div>`}
const originalRefresh=refresh;refresh=async function(){await originalRefresh();drawDashboard();let l=records.find(r=>r.id===$('lessons').value);if(l&&!$('lesson').value)$('lesson').value=l.text;};
async function loadDemo(){await run(async()=>{await call('demo',{});});if(records.some(r=>r.kind==='class')){$('status').textContent='模拟场景已就绪：12名学生、1份教案、2份检测/作业；每份10人提交、2人缺交。';switchView(0)}}
report=async function(){await run(async()=>{lastReport=await call('report',{assignment:chosen('assignments').id});let a=lastReport.analysis;let summary=a?.summary||[];$('report').innerHTML=`<h3>班级学习反馈</h3><div class="metrics"><div class="metric">已提交<b>${a?.students||0}</b></div><div class="metric">未提交<b>${lastReport.missing.length}</b></div><div class="metric">答题记录<b>${a?.submissions||0}</b></div><div class="metric">知识点<b>${summary.length}</b></div></div><table><thead><tr><th>知识点</th><th>正确率</th><th>正确 / 提交</th></tr></thead><tbody>${summary.map(s=>`<tr><td>${esc(s.topic)}</td><td><b>${s.rate}%</b><div class="bar"><i style="width:${s.rate}%"></i></div></td><td>${s.correct} / ${s.total}</td></tr>`).join('')}</tbody></table><h3>缺交名单</h3><p>${esc(lastReport.missing.join('、')||'全部已交')}</p><h3>后续教学建议</h3>${summary.map(s=>`<p>${esc(s.suggestion)}</p>`).join('')}<small>基于最终答案统计；具体错因仍需查看解题过程。</small><details><summary>查看逐题结果</summary><table><tr><th>学生</th><th>题目</th><th>结果</th></tr>${(a?.details||[]).map(d=>`<tr><td>${esc(d.student)}</td><td>${esc(d.question_id)}</td><td>${d.correct?'✓ 正确':'需复习'}</td></tr>`).join('')}</table></details>`})};
if(aid){document.body.classList.add('student-mode');dashboard.hidden=true}else{switchView(0);refresh()}
</script><script src="/interview.js"></script><script src="/visual.js"></script><script src="/product.js"></script><script src="/agent.js"></script><script src="/closedloop.js"></script><script src="/grades.js"></script><script src="/lesson_workspace.js"></script><script src="/access.js"></script>
