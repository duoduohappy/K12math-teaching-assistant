<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序 · 单元教学助手</title>
<style>body{margin:0;background:#f3f5f7;color:#20323d;font:15px system-ui}header{background:#163b40;color:white;padding:28px 6%}header h1{margin:0 0 8px}main{max-width:1100px;margin:24px auto;padding:0 20px}.tag{color:#b9e6d4}nav{display:flex;gap:10px;margin:20px 0}button{background:#16776b;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}nav button{background:#e0e8e7;color:#163b40}nav button.active{background:#16776b;color:white}.grid{display:grid;grid-template-columns:320px 1fr;gap:22px}.card{background:white;padding:24px;border-radius:14px;border:1px solid #e0e6e8}label{display:block;margin:15px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cad5d7;border-radius:7px;font:inherit}textarea{min-height:100px}h2{font-size:21px;margin-top:0}.muted{color:#677b83;font-size:13px;line-height:1.7}.notice{background:#fff6df;padding:12px;border-radius:8px;font-size:13px}.question{border-top:1px solid #eee;padding:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}pre{white-space:pre-wrap;line-height:1.8;font:inherit}.error{color:#ad302f}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}progress{accent-color:#16776b;width:100%}@media(max-width:740px){.grid{grid-template-columns:1fr}nav{flex-wrap:wrap}}</style>
<header><div class="tag">教师工作台 / 七年级数学</div><h1>知序 · 单元教学助手</h1><div>一元一次方程，从备课到教学反馈</div></header><main><div class="notice">本地 MVP · 自编演示内容 · 未适配特定教材版本 · 教案与练习须经教师审核。当前为模板与确定性算法模式，尚未接入大模型或 RAG。</div><nav id="nav"></nav><div id="app"></div><p id="status" role="status"></p></main>
<script>
let tab=0,plan=null,questions=[],report=null;const names=['01 备课设计','02 随堂练习','03 学情反馈','04 历史记录'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const topics='<option>移项</option><option>去括号</option><option>去分母</option>';
async function api(path,data){$('status').textContent='处理中…';try{let r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error);$('status').textContent='已完成并保存至本地历史';return v}catch(e){$('status').textContent=e.message;throw e}}
function download(name,text,type='text/plain'){let u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:type+';charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function show(n){tab=n;$('nav').innerHTML=names.map((s,i)=>`<button class="${i===n?'active':''}" onclick="show(${i})">${s}</button>`).join('');if(n===0){$('app').innerHTML=`<div class="grid"><section class="card"><h2>准备这一课</h2><label>单元</label><input value="一元一次方程" disabled><label>知识点</label><select id="topic">${topics}</select><label>课时（分钟）</label><input id="minutes" type="number" min="20" max="120" value="40"><label>班级情况</label><input id="context" value="基础混合班，需加强符号意识"><label>参考材料及出处（可选）</label><textarea id="source" placeholder="粘贴有权使用的材料，附教材版本、章节和页码。此版仅留存展示，不进行语义检索。"></textarea><div class="row"><button onclick="makePlan()">生成备课草案</button></div></section><section class="card" id="result">${planView()}</section></div>`}if(n===1){$('app').innerHTML=`<section class="card"><h2>生成可验算的随堂练习</h2><div class="muted">固定题型参数生成；当前三个题型均为基础题，不代表完整难度梯度。</div><label>知识点</label><select id="topic">${topics}</select><label>题数（1—20）</label><input id="count" type="number" value="5" min="1" max="20"><div class="row"><button onclick="makeQuestions()">生成并校验</button><button onclick="exportQuestions()">导出练习与答案</button></div><div id="questions">${questionsView()}</div></section>`}if(n===2){$('app').innerHTML=`<div class="grid"><section class="card"><h2>导入答题记录</h2><p class="muted">请先生成练习。CSV 表头：student,question_id,answer。建议使用匿名学生编号。</p><input type="file" accept=".csv" onchange="this.files[0]?.text().then(t=>$('csv').value=t)"><label>或粘贴 CSV</label><textarea id="csv" placeholder="student,question_id,answer"></textarea><div class="row"><button onclick="sample()">填入模拟数据</button><button onclick="grade()">分析答题结果</button></div></section><section class="card" id="report">${reportView()}</section></div>`}if(n===3){$('app').innerHTML='<section class="card"><h2>本地历史</h2><div id="history">加载中…</div></section>';fetch('/api/history').then(r=>r.json()).then(v=>{$('history').innerHTML=v.length?v.map(x=>`<details class="question"><summary>${esc(x.created)} · ${esc(x.kind)}</summary><pre>${esc(JSON.stringify(x.content,null,2))}</pre></details>`).join(''):'暂无记录'})}}
function planView(){return plan?`<h2>${esc(plan.title)}</h2><p class="muted">${esc(plan.provenance)}</p><label>教案草案（可编辑）</label><textarea id="draft" style="min-height:430px">${esc(planText())}</textarea><div class="row"><button onclick="savePlan()">确认审核并保存</button><button onclick="download('教案.txt',$('draft').value)">导出教案</button></div>`:'<h2>让教学目标先行</h2><p class="muted">选择知识点，生成课时安排、教学目标与练习建议。保留教师提供的资料及出处，审核后再用于课堂。</p>'}
function planText(){return [plan.title,'审核状态：'+plan.review,'班级：'+plan.class_context,'目标：'+plan.objectives.join('；'),'教学边界：'+plan.boundary,'重点：'+plan.focus,...plan.sections.map(s=>s.title+'：'+s.minutes+'分钟'),'参考材料：'+plan.source,'生成方式：'+plan.mode].join('\n\n')}
async function makePlan(){try{plan=await api('plan',{topic:$('topic').value,minutes:$('minutes').value,context:$('context').value,source:$('source').value});$('result').innerHTML=planView()}catch{}}
async function savePlan(){try{await api('save',{content:{text:$('draft').value,review:'教师已确认'}})}catch{}}
function questionsView(){return questions.map(q=>`<div class="question"><b>${esc(q.id)} · ${esc(q.text)}</b><p class="muted">${esc(q.topic)} · 已程序代入验算</p><details><summary>答案与解析</summary><p>x = ${esc(q.answer)}</p><p>${esc(q.explanation)}</p></details></div>`).join('')}
async function makeQuestions(){try{questions=await api('questions',{topic:$('topic').value,count:$('count').value});report=null;$('questions').innerHTML=questionsView()}catch{}}
function exportQuestions(){if(!questions.length){$('status').textContent='请先生成练习';return}download('随堂练习与答案.txt',questions.map(q=>q.id+' '+q.text+'\n答案：x='+q.answer+'\n'+q.explanation).join('\n\n'))}
function sample(){if(!questions.length){$('status').textContent='请先在随堂练习页面生成题目';return}$('csv').value='student,question_id,answer\n'+['S01','S02','S03'].flatMap((s,i)=>questions.map((q,j)=>`${s},${q.id},${Number(q.answer)+(i===2&&j%2===0?1:0)}`)).join('\n');$('status').textContent='已填入模拟数据，非真实学生成绩'}
async function grade(){try{if(!questions.length)throw Error('请先生成练习');report=await api('assess',{csv:$('csv').value,questions});$('report').innerHTML=reportView()}catch(e){$('status').textContent=e.message}}
function reportView(){return report?`<h2>这节课的学习反馈</h2><p>${report.students} 名学生 · ${report.submissions} 条答题记录</p>${report.summary.map(s=>`<h3>${esc(s.topic)} · ${s.rate}%</h3><progress value="${s.rate}" max="100"></progress><p>${s.correct}/${s.total} 答案正确</p><p>${esc(s.suggestion)}</p>`).join('')}<p class="notice">${esc(report.note)}</p><button onclick="download('学情报告.json',JSON.stringify(report,null,2),'application/json')">导出报告</button>`:'<h2>让反馈指导下一课</h2><p class="muted">分析已提交答案的知识点表现。缺交不计错，具体错因由教师结合解题过程确认。</p>'}show(0);
</script></html>
